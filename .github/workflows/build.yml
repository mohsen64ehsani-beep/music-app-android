
name: Build Music App APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'music-app-android-project-v17-cloud-build.zip'
      - 'nova-app-latest.html'
      - 'nova-series-and-ads.js'
      - 'nova-launcher-icon.xml'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o music-app-android-project-v17-cloud-build.zip -d extracted
          test -f extracted/music-app-android-project/app/src/main/assets/index.html
          cp nova-app-latest.html extracted/music-app-android-project/app/src/main/assets/index.html
          cp nova-series-and-ads.js extracted/music-app-android-project/app/src/main/assets/nova-series-and-ads.js
          mkdir -p extracted/music-app-android-project/app/src/main/res/drawable
          cp nova-launcher-icon.xml extracted/music-app-android-project/app/src/main/res/drawable/ic_launcher.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          manifest = Path('extracted/music-app-android-project/app/src/main/AndroidManifest.xml')
          if not manifest.exists():
              raise SystemExit('AndroidManifest.xml not found')
          tree = ET.parse(manifest)
          app = tree.getroot().find('application')
          if app is None:
              raise SystemExit('application tag not found in AndroidManifest.xml')
          ns = '{http://schemas.android.com/apk/res/android}'
          app.set(ns + 'label', 'NOVA MEDIA')
          app.set(ns + 'icon', '@drawable/ic_launcher')
          app.set(ns + 'roundIcon', '@drawable/ic_launcher')
          tree.write(manifest, encoding='utf-8', xml_declaration=True)
          PY
          test -s extracted/music-app-android-project/app/src/main/assets/index.html

      - name: Validate JavaScript sources
        run: |
          node --check nova-series-and-ads.js
          python3 - <<'PY'
          import re, pathlib, subprocess
          source = pathlib.Path('nova-app-latest.html').read_text(encoding='utf-8')
          for index, match in enumerate(re.finditer(r'<script([^>]*)>(.*?)</script *>', source, re.I | re.S)):
              attrs, code = match.group(1), match.group(2)
              if not code.strip() or 'src=' in attrs or 'application/json' in attrs:
                  continue
              path = pathlib.Path(f'/tmp/nova-inline-{index}.js')
              path.write_text(code, encoding='utf-8')
              subprocess.run(['node', '--check', str(path)], check=True)
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd extracted/music-app-android-project
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: music-app-debug-apk
          path: extracted/music-app-android-project/app/build/outputs/apk/debug/app-debug.apk
          
